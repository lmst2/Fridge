[mod-setting-description]
fridge-small-chest-capacity=Set the item storage capacity for small fridges. Default to 24, minimum 1, maximum 96
fridge-large-chest-capacity=Set the item storage capacity for large warehouses. Default to 200, minimum 1, maximum 1024
fridge-freeze-rate=Set the rate at which fridges slow down item spoilage. Ranged from 1 to 100. 1 means normal speed, 5 means 5 times slower, and so on
fridge-power-consumption=Set the power consumption rate of warehouse (in MW). Default to 10, minimum 0.01, maximum unlimited.
fridge-power-capacity=Set the power storage capacity of warehouse (in MJ). Default to 3000, minimum 0.1, maximum unlimited.
fridge-space-plantform-capacity=Set the bonus inventory capacity for space freezing warehouse
fridge-large-factory-optimization=Skip re-scanning a freezer whose item count has not changed since the last check.\n\nA freezer normally has every one of its slots read on every pass. With this on, the mod first asks the game how many items the container holds - one cheap question instead of hundreds - and if that number is unchanged it trusts its previous reading and moves on. On a base with hundreds of full freezers this is by far the largest saving available.\n\n[color=red]What it can cost you:[/color] the count stays the same if one item is taken out and another put in between two checks. The mod will not notice the new item until its next full scan, so an item that is inserted [item=spoilage]nearly spoiled[/item] can spoil inside a working freezer instead of being preserved. Items already in the freezer are never affected, and nothing else changes.\n\nLeave this off unless you are running a large factory and want the UPS back.
fridge-slot-budget=How many inventory slots the mod aims to process each tick.\n\nHigher means freshness bars update more smoothly and freezers are checked more often; lower means the mod costs less UPS. The work is always spread across ticks, so this changes the steady cost, never the size of a stutter.\n\nDoes not change how fast anything spoils.
fridge-max-refresh-gap=The longest the mod will go without checking a container, in ticks (60 = 1 second).\n\nOn a very large factory the mod stretches its checks further apart to keep the cost down; this is the limit on how far. Lower is smoother and more expensive, higher is cheaper and makes freshness bars step more visibly on short-lived items.\n\nDoes not change how fast anything spoils.
fridge-reaction-window=How quickly the mod notices items that machines insert into a fridge, in ticks (60 = 1 second).\n\nNothing tells a mod when an inserter or robot puts an item into a container, so the mod's regular refresh rhythm is what finds new arrivals - and with vanilla items that rhythm is always fast enough, so this setting sits idle and costs nothing.\n\nIf another mod adds items that spoil faster than the refresh rhythm can guarantee, the mod starts asking each fridge a single cheap question - has your item count gone up? - this often, and rescans just the fridges that answer yes. Lower reacts faster and costs slightly more; the window widens automatically if watching every fridge would exceed a quarter of the per-tick budget.\n\nDoes not change how fast anything spoils.
