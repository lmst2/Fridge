name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  busted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The same image as a local `bash spec/run.sh`, so CI and a developer's
      # machine cannot disagree about the toolchain.
      - name: Run the test suite
        run: bash spec/run.sh --output=gtest
